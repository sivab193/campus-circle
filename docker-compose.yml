services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["campus-circle-mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: campus_circle
      API_ADDR: 0.0.0.0:8080
      CORS_ORIGIN: http://localhost:3000
    ports: ["8081:8080"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  campus-circle-mongo:

